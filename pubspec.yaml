name: ps089
environment:
  sdk: ">=3.12.2 <4.0.0"

dev_dependencies:
  melos: ^8.6.0

workspace:
  - apps/mobile

melos:
  scripts:
    analyze:
      exec: flutter analyze .
      description: Run flutter analyze across all packages and apps.

    test:
      exec: flutter test
      packageFilters:
        flutter: true
      description: Run flutter test across Flutter packages and apps.

    clean:
      exec: flutter clean
      description: Clean build artifacts in all packages.